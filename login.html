<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden – NYTRO Bot</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">NYTRO</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="features.html">Features</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="api.html">API</a></li>
      </ul>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-primary">Anmelden</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="logo" style="justify-content:center;margin-bottom:20px;">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">NYTRO</span>
      </div>
      <h1>Willkommen zurück</h1>
      <p class="subtitle">Melde dich an, um dein Dashboard und deine Guilds zu verwalten.</p>

      <a href="callback.html" class="btn btn-discord btn-lg" style="width:100%;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        Mit Discord anmelden
      </a>

      <div class="auth-divider">oder</div>

      <form id="login-form" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="email">E-Mail (Demo)</label>
          <input type="email" id="email" placeholder="du@beispiel.de" value="demo@nytro.bot">
        </div>
        <div class="form-group">
          <label for="password">Passwort (Demo)</label>
          <input type="password" id="password" placeholder="••••••••" value="demo1234">
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:8px;">
          Anmelden
        </button>
      </form>

      <p style="margin-top:24px;font-size:0.85rem;color:var(--text-muted);">
        Demo-Modus: Jede Anmeldung leitet zum Dashboard weiter.<br>
        OAuth Callback: <code>/callback</code>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      localStorage.setItem('nytro_logged_in', 'true');
      localStorage.setItem('nytro_user', JSON.stringify({
        id: '123456789',
        username: 'DemoUser',
        discriminator: '0001',
        avatar: null
      }));
      window.location.href = 'dashboard.html';
      return false;
    }
  </script>
</body>
</html>
