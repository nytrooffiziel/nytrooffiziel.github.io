<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard – NYTRO</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar"><div class="nav-inner">
<a href="index.html" class="logo"><span>⚡</span> NYTRO</a>
<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="dashboard.html" class="active">Dashboard</a></li>
<li><a href="docs.html">Docs</a></li>
</ul>
<div class="nav-actions">
<span id="user-name" style="font-weight:600;color:var(--accent)"></span>
<a href="auth/logout" class="btn btn-outline btn-sm">Abmelden</a>
</div></div></nav>
<div class="dash">
<aside class="sidebar">
<h4>Übersicht</h4>
<a href="dashboard.html" class="side-link active">🏠 Meine Server</a>
<a href="api/invite" class="side-link">➕ Bot einladen</a>
</aside>
<main class="main">
<h1>Meine Server</h1>
<p class="subtitle">Nur Server mit <strong>Administrator</strong>-Rechten</p>
<div id="loading" class="loading"><div class="spinner"></div>Lade Server…</div>
<div id="guild-list" class="guild-grid" style="display:none"></div>
<div id="empty" class="card" style="display:none">
<h3>Keine Server gefunden</h3>
<p>Keine Admin-Rechte oder Bot nicht eingeladen.</p>
<a href="api/invite" class="btn btn-primary" style="margin-top:12px">Bot einladen</a>
</div>
</main>
</div>
<script src="js/main.js"></script>
<script>
(async () => {
  try {
    const me = await api('/api/me');
    if (me.error) { location.href = 'auth/login.html'; return; }
    document.getElementById('user-name').textContent = me.username;
    const data = await api('/api/guilds');
    document.getElementById('loading').style.display = 'none';
    if (!data.guilds?.length) {
      document.getElementById('empty').style.display = 'block';
      return;
    }
    const list = document.getElementById('guild-list');
    list.style.display = 'grid';
    list.innerHTML = data.guilds.map(g => {
      const icon = g.icon
        ? `<img src="https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=64">`
        : g.name.charAt(0);
      const status = g.botPresent
        ? '<span class="badge badge-ok">Bot online</span>'
        : '<span class="badge badge-warn">Bot fehlt</span>';
      const action = g.botPresent
        ? `<a href="guild.html?id=${g.id}" class="btn btn-primary btn-sm">Verwalten</a>`
        : `<a href="api/invite" class="btn btn-outline btn-sm">Einladen</a>`;
      return `<div class="guild-card"><div class="top"><div class="guild-icon">${icon}</div>
        <div><div class="guild-name">${g.name}</div>
        <div class="guild-meta">${g.memberCount != null ? g.memberCount + ' Mitglieder' : ''}</div></div></div>
        <div>${status}</div>${action}</div>`;
    }).join('');
  } catch (e) {
    document.getElementById('loading').textContent = 'Fehler – bitte anmelden.';
  }
})();
</script>
</body></html>
