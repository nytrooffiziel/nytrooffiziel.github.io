<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server – NYTRO</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar"><div class="nav-inner">
<a href="index.html" class="logo"><span>⚡</span> NYTRO</a>
<ul class="nav-links"><li><a href="dashboard.html">← Zurück</a></li></ul>
<div class="nav-actions">
<span id="user-name" style="font-weight:600;color:var(--accent)"></span>
<a href="auth/logout" class="btn btn-outline btn-sm">Abmelden</a>
</div></div></nav>
<div class="dash">
<aside class="sidebar">
<h4>Server</h4>
<a href="dashboard.html" class="side-link">🏠 Alle Server</a>
<h4>Einstellungen</h4>
<button class="side-link active tab-btn" data-tab="overview">📊 Übersicht</button>
<button class="side-link tab-btn" data-tab="modules">🧩 Module</button>
<button class="side-link tab-btn" data-tab="settings">⚙️ Settings</button>
<button class="side-link tab-btn" data-tab="automod">🤖 Auto-Mod</button>
</aside>
<main class="main">
<div id="loading" class="loading"><div class="spinner"></div>Lade…</div>
<div id="content" style="display:none">
<h1 id="guild-title">Server</h1>
<p class="subtitle" id="guild-sub"></p>
<div class="tab-content active" id="tab-overview">
<div class="grid" style="margin-bottom:24px">
<div class="card"><div class="guild-meta">Mitglieder</div><div style="font-size:1.6rem;font-weight:800;color:var(--accent)" id="stat-members">–</div></div>
<div class="card"><div class="guild-meta">Prefix</div><div style="font-size:1.6rem;font-weight:800;color:var(--accent)" id="stat-prefix">–</div></div>
</div>
<div class="card"><h3>Module</h3><div id="overview-modules" style="margin-top:12px"></div></div>
</div>
<div class="tab-content" id="tab-modules">
<div class="card"><h3>Module</h3><div id="module-toggles" style="margin-top:16px"></div></div>
</div>
<div class="tab-content" id="tab-settings">
<div class="card"><h3>Einstellungen</h3>
<div class="form-group" style="margin-top:16px"><label>Prefix</label><input id="prefix" maxlength="5"></div>
<button class="btn btn-primary" onclick="saveSettings()">Speichern</button>
</div></div>
<div class="tab-content" id="tab-automod">
<div class="card"><h3>Auto-Mod</h3>
<div class="toggle" style="margin-top:16px"><span>Anti-Invite</span><div class="toggle-switch" id="am-invite" onclick="this.classList.toggle('on')"></div></div>
<div class="toggle"><span>Anti-Links</span><div class="toggle-switch" id="am-links" onclick="this.classList.toggle('on')"></div></div>
<div class="form-group" style="margin-top:16px"><label>Max Mentions</label><input type="number" id="am-mentions" value="5"></div>
<div class="form-group"><label>Blockierte Wörter (Komma)</label><textarea id="am-words" rows="3"></textarea></div>
<button class="btn btn-primary" onclick="saveAutomod()">Speichern</button>
</div></div>
</div>
</main>
</div>
<script src="js/main.js"></script>
<script>
const guildId = new URLSearchParams(location.search).get('id');
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  };
});
(async () => {
  if (!guildId) { location.href = 'dashboard.html'; return; }
  const me = await api('/api/me');
  if (me.error) { location.href = 'auth/login.html'; return; }
  document.getElementById('user-name').textContent = me.username;
  const data = await api('/api/guilds/' + guildId);
  if (data.error) { location.href = 'dashboard.html'; return; }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('guild-title').textContent = data.name;
  document.getElementById('guild-sub').textContent = (data.memberCount||0) + ' Mitglieder';
  document.getElementById('stat-members').textContent = data.memberCount||0;
  document.getElementById('stat-prefix').textContent = data.settings?.prefix||'n!';
  document.getElementById('prefix').value = data.settings?.prefix||'n!';
  document.getElementById('overview-modules').innerHTML = (data.modules||[]).map(m =>
    `<span class="badge ${m.enabled?'badge-ok':'badge-off'}" style="margin:4px">${m.enabled?'✅':'❌'} ${m.name}</span>`).join('');
  document.getElementById('module-toggles').innerHTML = (data.modules||[]).map(m =>
    `<div class="toggle"><span style="font-weight:600;text-transform:capitalize">${m.name}</span>
    <div class="toggle-switch ${m.enabled?'on':''}" data-module="${m.name}" onclick="toggleMod(this)"></div></div>`).join('');
  if (data.automod?.anti_invite) document.getElementById('am-invite').classList.add('on');
  if (data.automod?.anti_links) document.getElementById('am-links').classList.add('on');
  document.getElementById('am-mentions').value = data.automod?.max_mentions??5;
  document.getElementById('am-words').value = (data.automod?.blocked_words||[]).join(', ');
})();
async function toggleMod(el) {
  const mod = el.dataset.module;
  const enabled = !el.classList.contains('on');
  el.classList.toggle('on');
  await api('/api/guilds/' + guildId + '/modules/' + mod, { method:'POST', body: JSON.stringify({ enabled }) });
  toast(mod + (enabled ? ' an' : ' aus'));
}
async function saveSettings() {
  await api('/api/guilds/' + guildId + '/settings', { method:'POST', body: JSON.stringify({ prefix: document.getElementById('prefix').value||'n!' }) });
  toast('Gespeichert');
}
async function saveAutomod() {
  const words = document.getElementById('am-words').value.split(',').map(w=>w.trim()).filter(Boolean);
  await api('/api/guilds/' + guildId + '/automod', { method:'POST', body: JSON.stringify({
    anti_invite: document.getElementById('am-invite').classList.contains('on')?1:0,
    anti_links: document.getElementById('am-links').classList.contains('on')?1:0,
    max_mentions: parseInt(document.getElementById('am-mentions').value)||5,
    blocked_words: words
  }) });
  toast('Auto-Mod gespeichert');
}
</script>
</body></html>
